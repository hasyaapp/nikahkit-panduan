<title id="ttl">Mengunggah banyak foto lewat menu Media</title>
<desc id="dsc">1. Di tab NikahKit, klik Media di rel kiri. 2. Seret beberapa foto dari folder komputer ke panel Media. 3. Lepas tombol mouse. Foto diunggah satu per satu. 4. Foto masuk ke Media Scalev dan tampil di grid. 5. File HEIC dilewati. Ubah ke JPG atau PNG dulu, lalu unggah lagi.</desc>
