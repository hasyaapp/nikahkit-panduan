<title id="ttl">Mengisi undangan dengan klik langsung di pratinjau</title>
<desc id="dsc">1. Pastikan tombol Klik aktif di rel (bukan Klik mati). 2. Arahkan mouse ke nama mempelai di pratinjau. 3. Klik namanya. Form Mempelai terbuka, kursor di Nama panggilan. 4. Klik bagian lain, misalnya Galeri Foto. Muncul toolbar kecil. 5. Isi membuka form, ↑ ↓ memindah bagian, Sembunyikan menutupnya. 6. Klik Sembunyikan. Salah klik? Tekan Urungkan di pesan bawah.</desc>
