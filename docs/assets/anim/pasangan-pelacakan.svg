<title id="ttl">Melihat siapa yang sudah membuka undangan</title>
<desc id="dsc">1. Di laptop, klik ikon Pelacakan di lajur kiri (di HP: lewat menu akun). 2. Tiap tamu: berapa kali dibuka, kapan pertama, dan jumlah perangkat. 3. Pakai tombol saring: Sudah dibuka, Belum dibuka, Perangkat penuh. 4. Klik tamu bertanda Perangkat penuh. Detailnya tampil di kanan. 5. Klik ⋮ lalu Buka kunci perangkat supaya tamu bisa buka di HP baru.</desc>
