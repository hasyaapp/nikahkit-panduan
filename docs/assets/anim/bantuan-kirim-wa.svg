<title id="ttl">Mengirim laporan ke admin Nikahin lewat WhatsApp</title>
<desc id="dsc">1. Buka Bantuan, gulir ke bawah, lalu klik Kirim lewat WhatsApp. 2. Tab baru terbuka ke WhatsApp admin Nikahin. 3. Pesan sudah berisi salam dan laporan teknis. Biarkan, jangan dihapus. 4. Tambahkan apa yang kamu lakukan, alamat halaman, dan screenshot. 5. Jangan kirim PIN, kode staff, atau data klien. 6. Klik kirim. Tunggu balasan admin di chat yang sama.</desc>
