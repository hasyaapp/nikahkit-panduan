<title id="ttl">Bonus pemakaian template Kreator</title>
<desc id="dsc">1. Tiap pesanan lunas yang memilih templatemu: bonus 10%. 2. Contoh: Paket Lengkap Rp229.000, bonusmu Rp22.900. 3. Bonus ditransfer bersama komisi, dua hari kerja setelah klien bayar. 4. Desain tetap milikmu dan boleh dipakai di luar Nikahin.</desc>
