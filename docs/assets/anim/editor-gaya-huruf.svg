<title id="ttl">Mengatur huruf, ukuran teks, bentuk, dan gerak</title>
<desc id="dsc">1. Di menu Gaya, klik tab Huruf. 2. Ukuran teks: klik ikon Besar supaya tulisan lebih mudah dibaca. 3. Mau font lain? Tempel link font dari Google Fonts di kolom Custom. 4. Klik tab Bentuk untuk sudut tombol, kartu, dan bingkai foto. 5. Pilih Lengkung. Bingkai foto di pratinjau ikut berubah. 6. Gerak Halus: bagian muncul pelan saat tamu menggulir.</desc>
