<title id="ttl">Mengirim undangan per tamu lewat WhatsApp</title>
<desc id="dsc">1. Buka tab Kirim. Tekan tombol + (Tambah tamu) di atas. 2. Tempel daftar tamu, satu nama per baris. 3. Tekan Simpan daftar. Tautan pribadi tiap tamu disiapkan. 4. Ketuk nama tamu. Muncul pratinjau pesan dengan tautan khusus dia. 5. Tekan tombol kirim hijau. WhatsApp terbuka dengan pesan siap kirim.</desc>
