<title id="ttl">Mengunduh dan mengekstrak ZIP NikahKit</title>
<desc id="dsc">1. Buka halaman Cara pasang NikahKit, klik Unduh NikahKit. 2. Buka folder Unduhan. File ZIP NikahKit ada di sana. 3. Windows: klik kanan ZIP, pilih Extract All... 4. Klik Extract. Windows membuat folder bernama sama dengan ZIP. 5. Buka folder itu. Di dalamnya ada folder NikahKit berisi manifest.json. 6. Folder NikahKit inilah yang dipilih nanti di Load unpacked.</desc>
