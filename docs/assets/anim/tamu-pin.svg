<title id="ttl">Membuat PIN dashboard dan menyalin pesan untuk pengantin</title>
<desc id="dsc">1. Di panel Bagikan, klik Kelola PIN dashboard. 2. Jendela NikahKit terbuka: Undangan ini belum punya PIN. 3. Klik Buat PIN. PIN 6 angka langsung tampil. 4. Klik ikon amplop: Salin pesan untuk pengantin. 5. Tempel di WhatsApp pengantin. Isinya undangan, dashboard, dan PIN.</desc>
