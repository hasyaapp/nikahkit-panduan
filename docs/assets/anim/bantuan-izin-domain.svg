<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="ttl dsc" font-family='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif' data-total="27.200000000000003" data-steps="0,3.8,7,10.8,14.200000000000001,18,21.6">
<title id="ttl">Memperbaiki Izin domain (CSP) dari Bantuan</title>
<desc id="dsc">1. Panel menulis Izinkan di tab Security: ada domain yang belum diizinkan. 2. Klik Bantuan, lalu gulir ke bagian Izin domain (CSP). 3. Sudah diizinkan: aman. Ditambahkan otomatis: aman setelah kamu klik Simpan. 4. Perlu ditambah manual: domain ini harus kamu izinkan sendiri. 5. Klik Salin domain kurang. Muncul Tersalin. Tempel di tab Security. 6. Buka tab Security, tempel, lalu simpan di Scalev. 7. Kembali ke Bantuan, klik Periksa ulang. Status jadi Sudah diizinkan.</desc>
