<title id="ttl">Mengaktifkan ePayment di toko Scalev</title>
<desc id="dsc">1. Klik Stores di menu kiri, lalu pilih nama toko kamu. 2. Scroll ke Metode Pembayaran, klik Pilih Metode Pembayaran. 3. Dialog muncul. Pada dropdown pilih Invoice. 4. Centang Aktifkan Metode Pembayaran ALL E-Payment. 5. Klik Simpan di dialog. 6. Klik Simpan di kanan atas supaya pengaturan tersimpan.</desc>
