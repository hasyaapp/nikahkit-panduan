<title id="ttl">Membagikan undangan dari panel Bagikan</title>
<desc id="dsc">1. Di editor, klik Bagikan di bagian bawah rel kiri. 2. Panel Bagikan terbuka. Kolom Nama tamu berisi contoh Nama Tamu. 3. Ganti dengan nama tamu. Tautan di bawahnya ikut berubah (?to=). 4. Klik Lihat sebagai tamu untuk mencoba. Nama tamu tampil di sampul. 5. Klik Salin tautan tamu. Muncul tulisan Tersalin. 6. Untuk pengantin: tombol menuju Dashboard pasangan.</desc>
