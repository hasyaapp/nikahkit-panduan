<title id="ttl">Mengganti warna undangan di menu Gaya</title>
<desc id="dsc">1. Klik Gaya di rel kiri, lalu pastikan tab Warna terpilih. 2. Di Custom ada lima warna dasar: Latar, Kartu, Judul, Teks, Aksen. 3. Klik kotak warna Aksen. Pemilih warna Chrome terbuka. 4. Pilih warna baru. Pratinjau langsung berubah. 5. Muncul Kurang kontras? Tulisan susah dibaca. Pilih warna lain. 6. Ingin kembali ke awal? Klik Kembalikan.</desc>
