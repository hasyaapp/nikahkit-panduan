<title id="ttl">Memilih template NikahKit</title>
<desc id="dsc">1. Klik Template di menu kiri. Pastikan pilihan Template yang aktif. 2. Klik kartu template yang kamu suka, misalnya Folio. 3. Halaman masih berisi HTML lain? Muncul konfirmasi. Klik Ganti. 4. Template terpasang. Kartunya bertanda Dipakai, pratinjau ikut berubah. 5. Mau ganti nanti? Klik kartu lain. Isian undangan tetap terbawa.</desc>
