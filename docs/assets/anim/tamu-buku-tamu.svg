<title id="ttl">Membuka Buku Tamu di Scalev dan memoderasi ucapan</title>
<desc id="dsc">1. Di sidebar Scalev, klik menu Buku Tamu. 2. Daftar undanganmu tampil. Klik satu undangan. 3. Ringkasan kehadiran di atas, ucapan di tab Ucapan. 4. Klik Sembunyikan. Ucapan tidak tampil lagi di undangan. 5. Centang beberapa baris untuk aksi sekaligus. 6. Klik Unduh daftar tamu (CSV) untuk menyimpan data RSVP.</desc>
