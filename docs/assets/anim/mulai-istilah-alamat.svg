<title id="ttl">ID undangan, slug, alamat, dan tautan pribadi</title>
<desc id="dsc">1. Angka di alamat editor adalah ID undangan (ID halaman Scalev). 2. Slug diisi di tab Settings Scalev. Slug membentuk alamat halaman. 3. Alamat umum: domain atau subdomain Scalev, lalu slug. 4. Tautan pribadi menambah ?to=Nama. Nama tamu tampil di sampul. 5. PIN dashboard untuk pasangan, kode staff untuk penerima tamu.</desc>
