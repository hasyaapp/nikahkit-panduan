<title id="ttl">Mengajukan template Canva ke tim Nikahin</title>
<desc id="dsc">1. Klik Bagikan, ubah akses tautan ke bisa mengedit, lalu salin. 2. Kirim lewat WhatsApp: nama template, dua font, dan Gmail NikahKit. 3. Tim Nikahin memeriksa, paling lama 7 hari. Jangan ubah desainnya. 4. Templatemu muncul hanya di akunmu dan Landing-mu.</desc>
