<title id="ttl">NikahKit dijeda karena kode diubah manual</title>
<desc id="dsc">1. Status di kaki rel berubah jadi Dijeda. NikahKit berhenti menulis. 2. Di panel muncul: Kode diubah di tab Code. NikahKit dijeda. 3. Klik Lihat di kode untuk melihat bagian yang diubah manual. 4. Kembali ke tab NikahKit. Pilih Timpa dengan NikahKit. 5. Perubahan manual dibuang, status kembali Tersimpan.</desc>
