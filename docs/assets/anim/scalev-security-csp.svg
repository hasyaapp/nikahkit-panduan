<title id="ttl">Izin domain (CSP) di Bantuan NikahKit dan tab Security Scalev</title>
<desc id="dsc">1. Di tab NikahKit, klik Bantuan di bawah rel kiri. 2. Lihat Izin domain (CSP): tiap domain punya status. 3. Ada &quot;Perlu ditambah manual&quot;? Klik Salin domain kurang. 4. Klik tab Security di strip editor Scalev. 5. Tempel domain di kolom yang sesuai jenisnya, misalnya Image Sources. 6. Simpan &amp; Terbitkan, lalu buka Bantuan lagi untuk cek ulang.</desc>
