<title id="ttl">Checklist sebelum menyerahkan undangan ke klien</title>
<desc id="dsc">1. Isi undangan: Konten, foto contoh, dan musik. 2. Slug terisi, halaman tersimpan, lalu Simpan &amp; Terbitkan. 3. Coba sebagai tamu, rapikan ucapan percobaan, buat PIN dashboard. 4. Undangan khusus, kode staff, dan label Sudah diisi di Pesanan masuk. 5. Semua tercentang: kirim pesan untuk pengantin.</desc>
