<title id="ttl">Checklist sebelum menyerahkan undangan ke klien</title>
<desc id="dsc">1. Sebelum serah ke klien, cek isi undangan dan foto. 2. Musik, simpan, dan terbit sudah beres. 3. Coba tautan sebagai tamu dengan ?to=Nama. 4. Buat PIN dashboard dan salin pesan untuk pengantin. 5. Undangan khusus dan kode staff: cek bila dipakai klien.</desc>
