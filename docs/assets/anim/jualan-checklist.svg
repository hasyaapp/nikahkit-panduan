<title id="ttl">Checklist sebelum menyerahkan undangan ke klien</title>
<desc id="dsc">1. Isi undangan: Konten, foto contoh, dan musik. 2. Halaman tersimpan dengan slug, lalu Simpan &amp; Terbitkan. 3. Coba sebagai tamu, buat PIN, salin pesan untuk pengantin. 4. Bila dipakai: Undangan khusus dan kode staff hari-H. 5. Semua tercentang: kirim pesan untuk pengantin.</desc>
