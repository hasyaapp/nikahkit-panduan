<title id="ttl">Mengatur RSVP dan Amplop Digital</title>
<desc id="dsc">1. Buka RSVP &amp; Ucapan. Pastikan ada tulisan hijau Tersambung. ID: (ID halaman). 2. Pilih Isi form dan jumlah tamu paling banyak per undangan. 3. Nyalakan sakelar yang kamu perlukan, misalnya Pilihan &quot;Masih ragu&quot;. 4. Lalu buka Amplop Digital. Rekening contoh sudah ada. 5. Ganti Nomor rekening dan Nama pemilik rekening dengan data klien. 6. Kartu rekening di pratinjau ikut berubah. Cek ulang nomornya.</desc>
