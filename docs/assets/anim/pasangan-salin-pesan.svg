<title id="ttl">Menyalin pesan serah terima untuk pengantin</title>
<desc id="dsc">1. Di editor undangan, klik Bagikan di lajur kiri NikahKit. 2. Klik Kelola PIN dashboard. Jendela NikahKit terbuka. 3. Klik Lihat PIN (atau Buat PIN kalau belum ada). 4. Klik ikon balon chat: Salin pesan untuk pengantin. 5. Pesan berisi link undangan, link dashboard, dan PIN. Tempel di WA.</desc>
