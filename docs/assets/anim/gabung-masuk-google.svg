<title id="ttl">Masuk ke NikahKit dengan akun Google</title>
<desc id="dsc">1. Di panel NikahKit, klik Masuk dengan Google. 2. Jendela NikahKit terbuka di atas editor, lalu jendela Google. 3. Klik akun Google yang dipakai untuk membership. 4. Berhasil: email Google-mu tampil di atas, dengan tombol Keluar. 5. Belum berlangganan? Lanjut ke Pilih paket.</desc>
