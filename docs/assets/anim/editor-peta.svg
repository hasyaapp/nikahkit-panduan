<title id="ttl">Peta editor NikahKit di Scalev</title>
<desc id="dsc">1. Di editor halaman Scalev (HTML Mode), buka tab NikahKit. 2. Kolom kiri adalah menu: Template, Gaya, Audio, Media, Lapisan, Konten. 3. Panel di tengah berisi isian menu yang sedang dibuka. 4. Di bawah menu ada alat: Bagikan, Urungkan, Pratinjau, Klik, Kosongkan. 5. Paling bawah: status simpan. Tersimpan berarti aman. 6. Di kanan, pratinjau undangan berubah setiap kamu mengetik.</desc>
