<title id="ttl">Membuat halaman HTML Mode di Scalev untuk undangan</title>
<desc id="dsc">1. Masuk app.scalev.com, lalu klik Landing Pages di menu kiri. 2. Klik tombol untuk membuat halaman baru. 3. Pilih HTML Mode. Editor Landing Page Studio terbuka. 4. Tab NikahKit muncul di samping Code, Media, Security, Settings. 5. Klik NikahKit. Selain Template dan Media, menu masih terkunci. 6. Klik Simpan. Alamat berubah jadi /pages/angka: itu ID undangan.</desc>
