<title id="ttl">Mengisi nama mempelai di Konten</title>
<desc id="dsc">1. Klik Konten di menu kiri. Daftar bagian undangan muncul. 2. Mempelai biasanya sudah terbuka. Bila tertutup, klik namanya. 3. Klik kotak Nama panggilan di bagian Mempelai Wanita. Hapus nama contoh. 4. Ketik nama panggilan klien, misalnya Sinta. 5. Sampul di pratinjau langsung berubah.</desc>
