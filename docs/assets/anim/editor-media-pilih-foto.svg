<title id="ttl">Memasang foto lewat tombol Pilih foto</title>
<desc id="dsc">1. Di Konten, buka kelompok yang punya foto, misalnya Mempelai. 2. Klik Pilih foto. Jendela Pilih foto terbuka. 3. Klik satu foto dari Media Scalev. 4. Klik Pakai foto. Foto langsung tampil di pratinjau. 5. Isi Deskripsi foto dengan kalimat singkat. 6. Wajah terpotong? Pilih Titik fokus Atas.</desc>
