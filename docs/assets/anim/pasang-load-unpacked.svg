<title id="ttl">Memasang NikahKit lewat Load unpacked</title>
<desc id="dsc">1. Ketik chrome://extensions di kolom alamat Chrome, lalu Enter. 2. Nyalakan Developer mode di kanan atas. 3. Klik Load unpacked. 4. Pilih folder NikahKit yang berisi manifest.json, bukan ZIP-nya. 5. Klik Select. Kartu NikahKit muncul dan aktif. 6. Opsional: klik ikon puzzle, lalu sematkan NikahKit.</desc>
