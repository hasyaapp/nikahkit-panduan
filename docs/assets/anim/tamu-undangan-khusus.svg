<title id="ttl">Menyalakan Undangan khusus</title>
<desc id="dsc">1. Di panel Bagikan, gulir ke bagian Undangan khusus. 2. Klik sakelar Undangan khusus sampai menyala biru. 3. Buka pilihan Keamanan. Ada tiga mode. 4. Contoh: pilih + Kunci perangkat. 5. Atur Perangkat per tamu (1 sampai 10), lalu Simpan di Scalev. 6. Orang tanpa tautan tamu hanya melihat layar pribadi ini.</desc>
