<title id="ttl">Mengisi Profil merek di Template &gt; Marketing</title>
<desc id="dsc">1. Buka tab NikahKit, lalu klik Template di rel kiri. 2. Di Kategori, klik Marketing. Profil merek ada paling atas. 3. Isi Nama bisnis dan Nomor WhatsApp (boleh 08xx). 4. Gulir ke bawah: isi Nama paket dan Harga (Rp). Maksimal 3 paket. 5. Klik Simpan profil. Muncul Profil tersimpan. dan badge Terisi.</desc>
