<title id="ttl">Mencari arti pesan galat di panduan</title>
<desc id="dsc">1. Catat pesan persis seperti di layar, lalu buka halaman Pesan galat. 2. Tekan Ctrl+F (Mac: Cmd+F). Kotak cari muncul di kanan atas. 3. Ketik beberapa kata awal pesannya, misalnya Sesi berakhir. 4. Baris yang cocok ditandai kuning. 5. Baca kolom Artinya supaya tahu penyebabnya. 6. Ikuti kolom Yang harus dilakukan. Di sini: masuk lagi.</desc>
