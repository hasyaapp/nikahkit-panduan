<title id="ttl">Menambahkan domain sendiri ke Scalev lewat Cloudflare</title>
<desc id="dsc">1. Siapkan dulu: domain dibeli, DNS dipindah ke Cloudflare. 2. Di Scalev, buka menu Setting lalu Domain. 3. Klik Tambahkan Domain. 4. Ketik domain atau subdomain, lalu klik Simpan. 5. Salin tiap record ke Cloudflare satu per satu, Proxy: DNS Only. 6. Klik Verifikasi. Bisa butuh sampai 2x24 jam, ulangi berkala.</desc>
