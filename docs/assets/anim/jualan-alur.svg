<title id="ttl">Alur jualan undangan dari klien sampai hari-H</title>
<desc id="dsc">1. Klien menemukan Landing page kamu, lalu mengisi form data undangan. 2. Isian klien masuk ke Pesanan masuk di panel NikahKit. 3. Klik nama klien: semua kolom undangan terisi otomatis. 4. Ganti foto contoh, lalu Simpan &amp; Terbitkan di Scalev. 5. Kirim PIN dan pesan untuk pengantin. Mereka kirim undangan ke tamu. 6. Hari-H: check-in. Setelah acara: Buka untuk semua.</desc>
