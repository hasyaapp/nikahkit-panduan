<title id="ttl">Membuka Pengaturan undangan dan Buka untuk semua</title>
<desc id="dsc">1. Di HP, ketuk lingkaran inisial di ujung kanan tab bawah. 2. Pilih Pengaturan undangan. 3. Bagian Undangan: buka undangan sebagai tamu, atau ke Kirim. 4. Buka untuk semua: undangan khusus terbuka tanpa tautan tamu. 5. Ketuk lagi untuk kembali khusus tamu. Status kembali Mati.</desc>
