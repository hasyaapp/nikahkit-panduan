<title id="ttl">Membandingkan paket Bulanan, Tahunan, dan Sekali Bayar</title>
<desc id="dsc">1. Bulanan: Rp79.000 per 30 hari. Cocok untuk mencoba dulu. 2. Tahunan: Rp299.000 per tahun, setara Rp24.917/bulan. 3. Sekali Bayar: Rp699.000, tanpa perpanjang. 4. Akun staff dan impor CSV hanya di Tahunan dan Sekali Bayar. 5. Masa aktif habis: tenggang 7 hari, undangan tetap tampil. 6. Harga belum termasuk biaya layanan pembayaran Scalev.</desc>
