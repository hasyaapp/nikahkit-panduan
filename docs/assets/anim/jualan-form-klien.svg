<title id="ttl">Klien mengisi form data undangan</title>
<desc id="dsc">1. Langkah Pesanan: pilih Paket, centang fitur, tulis Desain. 2. Centang fitur yang dipesan, lalu tekan lanjut. 3. Kolom bertanda * wajib. Tekan lanjut saat kosong: muncul pesan merah. 4. Isi Nama dan WhatsApp, lalu lanjut ke langkah berikutnya. 5. Langkah terakhir Catatan: tekan kirim data. 6. Klien melihat Data terkirim. Datanya masuk ke Pesanan masuk kamu.</desc>
