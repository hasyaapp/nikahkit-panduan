<title id="ttl">Simpan dan Simpan &amp; Terbitkan di editor Scalev</title>
<desc id="dsc">1. Kamu mengubah isi undangan. Scalev belum menyimpannya. 2. Panel Bagikan mengingatkan: Perubahan belum disimpan di Scalev. 3. Ada dua tombol: Simpan dan Simpan &amp; Terbitkan. 4. Klik Simpan &amp; Terbitkan supaya tamu melihat versi terbaru. 5. Buka alamat publik di HP: RSVP dan YouTube aktif setelah terbit. 6. Tertahan &quot;not finished previewing&quot;? Muat ulang, lalu terbitkan lagi.</desc>
