<title id="ttl">Pola memperbaiki masalah: baca pesan, perbaiki, periksa lagi</title>
<desc id="dsc">1. Panel NikahKit menampilkan pesan, bukan rel menu seperti biasa. 2. Baca baris tebal: itu gejalanya. Baris kedua: langkah perbaikan. 3. Cari pesan itu di halaman Pesan galat atau Masalah umum. 4. Lakukan perbaikannya. Contoh ini: pastikan internet tersambung. 5. Klik Periksa lagi. 6. Berhasil bila rel menu NikahKit muncul lagi.</desc>
