<title id="ttl">Menambah acara di Acara &amp; Tanggal</title>
<desc id="dsc">1. Di Konten, buka Acara &amp; Tanggal. Pilih Zona waktu: WIB, WITA, atau WIT. 2. Acara contoh yang tak dipakai sudah dihapus. Klik Tambah acara. 3. Isi Nama acara, misalnya Resepsi. 4. Isi Mulai dan Selesai. Selesai lebih awal? Muncul pesan merah. 5. Perbaiki jam selesai. Pesan hilang, acara tampil di pratinjau.</desc>
