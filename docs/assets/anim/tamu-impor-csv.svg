<title id="ttl">Mengimpor daftar tamu dari file CSV</title>
<desc id="dsc">1. Buka undangan di Buku Tamu, lalu klik tab Tautan personal. 2. Klik Impor daftar tamu (CSV). 3. Pilih file CSV-mu, lalu Open. 4. Cek pratinjau: berapa tamu siap, baris mana yang dilewati. 5. Klik Impor 3 tamu. Tautan personal mereka langsung jadi.</desc>
