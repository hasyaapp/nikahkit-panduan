<title id="ttl">Membuat kode staff penerima tamu</title>
<desc id="dsc">1. Di detail undangan, klik Staff penerima tamu. 2. Klik + Tambah staff. 3. Ketik nama staff, lalu klik Buat kode. 4. Kode 8 karakter tampil sekali saja. Kirim lewat WA atau salin. 5. Staff masuk dengan kode itu di kolom PIN atau kode staff. 6. Selesai acara? Klik Cabut. Kode langsung tidak berlaku.</desc>
