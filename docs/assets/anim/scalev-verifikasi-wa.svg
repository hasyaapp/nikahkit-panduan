<title id="ttl">Verifikasi nomor WhatsApp di Scalev</title>
<desc id="dsc">1. Buka menu Setting, lalu Profil, lalu klik Edit. 2. Isi nomor WhatsApp kamu, lalu klik Save. 3. Jendela konfirmasi muncul. Klik Verifikasi. 4. WhatsApp terbuka dengan kode OTP. Kirim apa adanya. 5. Kembali ke Scalev, klik Cek Verifikasi.</desc>
